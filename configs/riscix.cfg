# Arculator machine config for RISC iX 1.21c.
# Values follow the known-good setup from the stardot thread
# (https://stardot.org.uk/forums/viewtopic.php?t=28042).
# support_rom_enabled maps Arculator's 64KB support ROM (roms/arcrom_ext),
# which carries the HostFS module: RISC OS boots from HostFS (the hostfs/
# directory next to the binary), where hostfs/!Boot configures the machine
# and boots RISC iX. See docs/how-it-works.md, "CMOS and the boot script".
# Sections and keys are what Arculator's src/config.c reads; enum numbers
# come from src/wx-config.cc: cpu_type 10 = ARM3/40MHz (the fastest offered;
# a real A540 is 4 = 26MHz, and the clock makes no difference to the boot time,
# which is disc-bound), memc_type 2 = MEMC1a 12MHz. mem_size is in KB. fdc_type 0 = WD1770 (old IO, as on the A540).
# cpu_type, memc_type and mem_size are the `fast` machine profile: the
# entrypoint rewrites them at each start from DOCKERIX_PROFILE (see
# Profile in cli/src/config.rs).
machine = a540
rom_set = riscos311
cpu_type = 10
memc_type = 2
mem_size = 16384
fpa = 0
fpu_type = 1
fdc_type = 0
st506_present = 0
monitor_type = multisync
display_mode = 0
double_scan = 1
video_scale = 1
renderer_driver = software
podule_0 = aka31
podule_1 = aeh50
podule_2 =
podule_3 =
support_rom_enabled = 1

# Acorn SCSI podule in slot 0. The disc image is the working copy seeded
# into /state by the entrypoint; 528808 blocks = 270,749,696 bytes.
[aka31.0]
device0_type = hd
device0_fn = /state/hdimage.hdf
device0_size = 528808

# Ethernet II podule in slot 1, SLiRP NAT (10.0.2.15, gateway 10.0.2.2).
[aeh50.1]
network_device = slirp
